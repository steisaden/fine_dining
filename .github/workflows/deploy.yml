name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & Build
        run: |
          npm install -g pnpm
          pnpm install
          mkdir -p dist_gh
          go run ./cmd/server -generate dist_gh
          pnpm build || true
          cp -r public/* dist_gh/ 2>/dev/null || true
          cp -r dist_gh/pages/* dist_gh/ 2>/dev/null || true
          touch dist_gh/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist_gh'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
